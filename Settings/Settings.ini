[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!UpdateMeasure mForceTheme][!HideMeterGroup AllTeamGroups][!HideMeterGroup ActiveLeague][!HideMeterGroup ActiveTheme][!ShowMeter "ThemeActive_#Theme#"][!UpdateMeasure mInitLeague][!UpdateMeter *][!Redraw]

[Metadata]
Name=FootballSuite - Settings
Version=2.4
Author=N04H
Information=Kontrollzentrum für FootballSuite (13 Ligen, 4 Themes, Alle Teams der Ligen)

[Variables]
; Farb-Fallbacks (dark) - werden durch @Include überschrieben
CardBg=18,24,36,235
CardBorder=56,189,248,60
CardBorderW=1
FG=248,250,252,255
Muted=148,163,184,255
DimText=100,116,139,255
Accent=56,189,248,255
HighlightRow=56,189,248,38
HighlightTeam=56,189,248,255
ColPromote=52,211,153,255
ColRelegate=248,113,113,255
FontName=Segoe UI Semibold
FontMono=Consolas
FontSize=11
League=bl2
LeagueName=2. Bundesliga
Season=2026
Theme=dark
TeamId=105
TeamName=Karlsruher SC
TeamShort=KSC
BtnBg=28,36,54,230
DivCol=45,58,85,180
CardW=620
CardH=495
PadX=18

; Echte Werte aus Variables.inc (überschreibt Fallbacks):
@Include=#@#Variables.inc

@Include2=#@#Styles.inc

; Styles für Settings
[StyleBase]
FontFace=#FontName#
FontSize=9
FontColor=#FG#
AntiAlias=1
DynamicVariables=1

[StyleLabel]
FontFace=#FontName#
FontSize=8.5
FontColor=#Accent#
FontWeight=700
AntiAlias=1
DynamicVariables=1

[StyleDim]
FontFace=#FontName#
FontSize=8.5
FontColor=#Muted#
AntiAlias=1
DynamicVariables=1

[StyleTitle]
FontFace=#FontName#
FontSize=12.5
FontColor=#FG#
FontWeight=700
AntiAlias=1
DynamicVariables=1

[mForceTheme]
Measure=String
String=#Theme#
IfMatch=^trans_white$
IfMatchAction=[!SetOption CardBG Fill "Color 18,24,36,250"][!SetOption CardBG Stroke "Color 56,189,248,80"][!SetOption CardBG StrokeWidth "1"][!SetVariable BtnBg "28,36,54,230"][!SetVariable DivCol "45,58,85,180"][!UpdateMeter CardBG][!Redraw]
IfMatch2=^trans_black$
IfMatchAction2=[!SetOption CardBG Fill "Color 18,24,36,250"][!SetOption CardBG Stroke "Color 56,189,248,80"][!SetOption CardBG StrokeWidth "1"][!SetVariable BtnBg "28,36,54,230"][!SetVariable DivCol "45,58,85,180"][!SetVariable FG "248,250,252,255"][!SetVariable Muted "148,163,184,255"][!SetVariable Accent "56,189,248,255"][!UpdateMeter CardBG][!Redraw]
IfMatch3=(?i)light
IfMatchAction3=[!SetOption CardBG Fill "Color #CardBg#"][!SetOption CardBG Stroke "Color #CardBorder#"][!SetOption CardBG StrokeWidth "#CardBorderW#"][!SetVariable BtnBg "230,235,245,240"][!SetVariable DivCol "195,205,220,200"][!UpdateMeter CardBG][!Redraw]
IfNotMatchAction=[!SetOption CardBG Fill "Color #CardBg#"][!SetOption CardBG Stroke "Color #CardBorder#"][!SetOption CardBG StrokeWidth "#CardBorderW#"][!SetVariable BtnBg "28,36,54,230"][!SetVariable DivCol "45,58,85,180"][!UpdateMeter CardBG][!Redraw]
DynamicVariables=1

[mInitTheme]
Measure=String
String=#Theme#
DynamicVariables=1
IfMatch=(?i)^dark$
IfMatchAction=[!ShowMeter "ThemeActive_dark"][!Redraw]
IfMatch2=(?i)^glass$
IfMatchAction2=[!ShowMeter "ThemeActive_glass"][!Redraw]
IfMatch3=(?i)^oled$
IfMatchAction3=[!ShowMeter "ThemeActive_oled"][!Redraw]
IfMatch4=(?i)^light$
IfMatchAction4=[!ShowMeter "ThemeActive_light"][!Redraw]
IfMatch5=(?i)^trans_white$
IfMatchAction5=[!ShowMeter "ThemeActive_trans_white"][!Redraw]
IfMatch6=(?i)^trans_black$
IfMatchAction6=[!ShowMeter "ThemeActive_trans_black"][!Redraw]

[mInputCustomTeamId]
Measure=Plugin
Plugin=InputText
X=298
Y=230
W=170
H=32
FontFace=#FontName#
FontSize=10
FontColor=#FG#
SolidColor=#BtnBg#
DefaultValue=#TeamId#
Command1=[!WriteKeyValue Variables TeamId "$UserInput$" "#@#Variables.inc"][!WriteKeyValue Variables TeamName "Team $UserInput$" "#@#Variables.inc"][!WriteKeyValue Variables TeamShort "$UserInput$" "#@#Variables.inc"][!SetVariable TeamId "$UserInput$"][!SetVariable TeamName "Team $UserInput$"][!UpdateMeter CurrentTeamDisplay][!Refresh "FootballSuite\NextMatch"][!Refresh "FootballSuite\Table"][!Redraw]
DynamicVariables=1

[mInitLeague]
Measure=String
String=#League#
DynamicVariables=1
IfMatch1=(?i)^bl1$
IfMatchAction1=[!ShowMeter "LeagueActive_bl1"][!ShowMeterGroup "Groupbl1"][!SetVariable CardH "492"][!UpdateMeter CardBG][!Redraw]
IfMatch2=(?i)^bl2$
IfMatchAction2=[!ShowMeter "LeagueActive_bl2"][!ShowMeterGroup "Groupbl2"][!SetVariable CardH "492"][!UpdateMeter CardBG][!Redraw]
IfMatch3=(?i)^bl3$
IfMatchAction3=[!ShowMeter "LeagueActive_bl3"][!ShowMeterGroup "Groupbl3"][!SetVariable CardH "492"][!UpdateMeter CardBG][!Redraw]
IfMatch4=(?i)^pl$
IfMatchAction4=[!ShowMeter "LeagueActive_pl"][!ShowMeterGroup "Grouppl"][!SetVariable CardH "492"][!UpdateMeter CardBG][!Redraw]
IfMatch5=(?i)^la1$
IfMatchAction5=[!ShowMeter "LeagueActive_la1"][!ShowMeterGroup "Groupla1"][!SetVariable CardH "492"][!UpdateMeter CardBG][!Redraw]
IfMatch6=(?i)^lg1$
IfMatchAction6=[!ShowMeter "LeagueActive_lg1"][!ShowMeterGroup "Grouplg1"][!SetVariable CardH "492"][!UpdateMeter CardBG][!Redraw]
IfMatch7=(?i)^ch1$
IfMatchAction7=[!ShowMeter "LeagueActive_ch1"][!ShowMeterGroup "Groupch1"][!SetVariable CardH "428"][!UpdateMeter CardBG][!Redraw]
IfMatch8=(?i)^CA2024$
IfMatchAction8=[!ShowMeter "LeagueActive_CA2024"][!ShowMeterGroup "GroupCA2024"][!SetVariable CardH "460"][!UpdateMeter CardBG][!Redraw]
IfMatch9=(?i)^ucl$
IfMatchAction9=[!ShowMeter "LeagueActive_ucl"][!ShowMeterGroup "Groupucl"][!SetVariable CardH "620"][!UpdateMeter CardBG][!Redraw]
IfMatch10=(?i)^(uel|uel2026)$
IfMatchAction10=[!ShowMeter "LeagueActive_uel"][!ShowMeterGroup "Groupuel"][!SetVariable CardH "620"][!UpdateMeter CardBG][!Redraw]
IfMatch11=(?i)^unl2024$
IfMatchAction11=[!ShowMeter "LeagueActive_unl2024"][!ShowMeterGroup "Groupunl2024"][!SetVariable CardH "428"][!UpdateMeter CardBG][!Redraw]
IfMatch12=(?i)^em$
IfMatchAction12=[!ShowMeter "LeagueActive_em"][!ShowMeterGroup "Groupem"][!SetVariable CardH "524"][!UpdateMeter CardBG][!Redraw]
IfMatch13=(?i)^wm2026$
IfMatchAction13=[!ShowMeter "LeagueActive_wm2026"][!ShowMeterGroup "Groupwm2026"][!SetVariable CardH "716"][!UpdateMeter CardBG][!Redraw]

; =======================================================
; Hintergrund & Header
; =======================================================
[CardBG]
Meter=Shape
Shape=Rectangle 0,0,#CardW#,#CardH#,12 | Fill Color #CardBg# | StrokeWidth #CardBorderW# | Stroke Color #CardBorder#
DynamicVariables=1

[Title]
Meter=String
MeterStyle=StyleTitle
X=#PadX#
Y=12
Text=FootballSuite Einstellungen

[BtnClose]
Meter=String
MeterStyle=StyleDim
X=(#CardW# - #PadX#)
Y=11
StringAlign=Right
FontSize=14
FontWeight=700
FontColor=#Muted#
Text=X
ToolTipText=Schliessen
MouseOverAction=[!SetOption BtnClose FontColor "248,113,113"][!UpdateMeter BtnClose][!Redraw]
MouseLeaveAction=[!SetOption BtnClose FontColor "#Muted#"][!UpdateMeter BtnClose][!Redraw]
LeftMouseUpAction=[!DeactivateConfig "FootballSuite\Settings"]
DynamicVariables=1

[DividerTop]
Meter=Shape
Shape=Line #PadX#,36,(#CardW# - #PadX#),36 | Stroke Color #DivCol# | StrokeWidth 1
DynamicVariables=1

; =======================================================
; ABSCHNITT 1: FARBSCHEMA (6 Themes)
