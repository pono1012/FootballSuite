[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!UpdateMeasure mMatchesJSON]
RightMouseUpAction=[!UpdateMeasure mMatchesJSON]

[Metadata]
Name=FootballSuite - Next Match
Version=2.0
Author=N04H
Information=Letztes und naechstes Spiel fuer das konfigurierte Team

[Variables]
; Farb-Fallbacks (dark) – werden durch @Include ueberschrieben
CardBg=18,24,36,235
CardBorder=56,189,248,60
CardBorderW=1
FG=248,250,252,255
Muted=148,163,184,255
DimText=100,116,139,255
Accent=56,189,248,255
HighlightRow=56,189,248,38
ColPromote=52,211,153,255
ColRelegate=248,113,113,255
FontName=Segoe UI Semibold
FontMono=Consolas
FontSize=11
TeamId=105
TeamName=Karlsruher SC
LogoDir=#@#logos\
FallbackLogo=#@#logos\default.png
@Include=#@#Variables.inc
CardW=360
CardH=265
PadX=18
LogoSize=64
; Fallback-Spielwerte
LTeamHome=Lade...
LTeamAway=Lade...
LLogoHome=#@#logos\default.png
LLogoAway=#@#logos\default.png
LDateFmt=-
LScore=- : -
LLeague=-
NTeamHome=Lade...
NTeamAway=Lade...
NLogoHome=#@#logos\default.png
NLogoAway=#@#logos\default.png
NDateFmt=-
NLeague=-
@Include2=#@#Styles.inc

; =======================================================
; Measures
; =======================================================
[mNextMatchScript]
Measure=Script
ScriptFile=#@#NextMatch.lua
UpdateDivider=60

[mMatchesJSON]
Measure=Plugin
Plugin=WebParser
URL=https://api.openligadb.de/getmatchesbyteamid/#TeamId#/50/50
RegExp=(?siU)^(.*)$
CodePage=65001
UpdateRate=900
DynamicVariables=1
FinishAction=[!CommandMeasure mNextMatchScript "ParseMatches()"]

[mMatchesJSONString]
Measure=Plugin
Plugin=WebParser
URL=[mMatchesJSON]
StringIndex=1

; =======================================================
; Hintergrund Card
; =======================================================
[CardBG]
Meter=Shape
Shape=Rectangle 0,0,#CardW#,#CardH#,10 | Fill Color #CardBg# | StrokeWidth #CardBorderW# | Stroke Color #CardBorder#
DynamicVariables=1

[HeaderTitle]
Meter=String
MeterStyle=StyleTitle
X=#PadX#
Y=14
W=(#CardW# - #PadX# - 90)
ClipString=1
FontColor=#FG#
Text=#TeamName#
ToolTipText=Klick zum Aktualisieren
LeftMouseUpAction=[!CommandMeasure mMatchesJSON "Update"]
DynamicVariables=1

[HeaderSettingsBtn]
Meter=String
MeterStyle=StyleMuted
X=(#CardW# - #PadX#)
Y=15
StringAlign=Right
FontSize=9.5
FontWeight=600
FontColor=#Accent#
Text=Optionen
ToolTipText=Klick: Einstellungen oeffnen
LeftMouseUpAction=[!ActivateConfig "FootballSuite\Settings" "Settings.ini"][!Refresh "FootballSuite\Settings"]
DynamicVariables=1

[HeaderDivider]
Meter=Shape
Shape=Line #PadX#,42,(#CardW# - #PadX#),42 | Stroke Color #CardBorder# | StrokeWidth #CardBorderW#
DynamicVariables=1

; =======================================================
; ROW 1: LETZTES SPIEL
; =======================================================
[SectionLabelLast]
Meter=String
MeterStyle=StyleDim
X=#PadX#
Y=48
FontSize=9
FontWeight=700
FontColor=#Accent#
Text=LETZTES ERGEBNIS
DynamicVariables=1

[LDate]
Meter=String
MeterStyle=StyleDim
X=(#CardW# - #PadX#)
Y=48
StringAlign=Right
FontSize=9.5
FontWeight=600
FontColor=#Muted#
Text=#LDateFmt#
DynamicVariables=1

[LLogoHome]
Meter=Image
ImageName=#LLogoHome#
X=(#PadX# + 6)
Y=68
W=64
H=64
PreserveAspectRatio=1
DynamicVariables=1

[LLogoAway]
Meter=Image
ImageName=#LLogoAway#
X=(#CardW# - #PadX# - 64 - 6)
Y=68
W=64
H=64
PreserveAspectRatio=1
DynamicVariables=1

[LLeague]
Meter=String
MeterStyle=StyleDim
X=(#CardW# / 2)
Y=68
StringAlign=CenterTop
W=180
ClipString=1
FontSize=8.5
FontWeight=700
FontColor=#Muted#
Text=#LLeague#
ToolTipText=Wettbewerb: #LLeague#
DynamicVariables=1

[LScore]
Meter=String
MeterStyle=StyleBase
X=(#CardW# / 2)
Y=82
StringAlign=CenterTop
FontSize=20
FontWeight=800
FontColor=#FG#
Text=#LScore#
DynamicVariables=1

[LTeams]
Meter=String
MeterStyle=StyleBase
X=(#CardW# / 2)
Y=116
StringAlign=CenterTop
W=210
ClipString=1
FontSize=10.5
FontWeight=600
FontColor=#FG#
Text=#LTeamHome#  -  #LTeamAway#
DynamicVariables=1

; =======================================================
; Trennlinie
; =======================================================
[MidDivider]
Meter=Shape
Shape=Line #PadX#,146,(#CardW# - #PadX#),146 | Stroke Color #CardBorder# | StrokeWidth #CardBorderW#
DynamicVariables=1

; =======================================================
; ROW 2: NAECHSTES SPIEL
; =======================================================
[SectionLabelNext]
Meter=String
MeterStyle=StyleDim
X=#PadX#
Y=154
FontSize=9
FontWeight=700
FontColor=#Accent#
Text=KOMMENDES SPIEL
DynamicVariables=1

[NDate]
Meter=String
MeterStyle=StyleDim
X=(#CardW# - #PadX#)
Y=154
StringAlign=Right
FontSize=9.5
FontWeight=600
FontColor=#Muted#
Text=#NDateFmt#
DynamicVariables=1

[NLogoHome]
Meter=Image
ImageName=#NLogoHome#
X=(#PadX# + 6)
Y=176
W=64
H=64
PreserveAspectRatio=1
DynamicVariables=1

[NLogoAway]
Meter=Image
ImageName=#NLogoAway#
X=(#CardW# - #PadX# - 64 - 6)
Y=176
W=64
H=64
PreserveAspectRatio=1
DynamicVariables=1

[NLeague]
Meter=String
MeterStyle=StyleDim
X=(#CardW# / 2)
Y=176
StringAlign=CenterTop
W=180
ClipString=1
FontSize=8.5
FontWeight=700
FontColor=#Accent#
Text=#NLeague#
ToolTipText=Wettbewerb: #NLeague#
DynamicVariables=1

[NVS]
Meter=String
MeterStyle=StyleBase
X=(#CardW# / 2)
Y=192
StringAlign=CenterTop
FontSize=15
FontWeight=800
FontColor=#FG#
Text=VS
DynamicVariables=1

[NTeams]
Meter=String
MeterStyle=StyleBase
X=(#CardW# / 2)
Y=222
StringAlign=CenterTop
W=210
ClipString=1
FontSize=10.5
FontWeight=600
FontColor=#FG#
Text=#NTeamHome#  -  #NTeamAway#
DynamicVariables=1