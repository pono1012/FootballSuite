@Include2=#@#Styles.inc

; =======================================================
; Measures
; =======================================================
[m.Year]
Measure=Time
Format=%Y

[m.Month]
Measure=Time
Format=%m

[m.SeasonScript]
Measure=Script
ScriptFile=#@#Table.lua
UpdateDivider=60

[mJSON]
Measure=Plugin
Plugin=WebParser
URL=https://api.openligadb.de/getbltable/#League#/#Season#
RegExp=(?siU)^(.*)$
CodePage=65001
UpdateRate=21600
DynamicVariables=1
FinishAction=[!CommandMeasure m.SeasonScript "ParseJSON()"]

[mJSONString]
Measure=Plugin
Plugin=WebParser
URL=[mJSON]
StringIndex=1

; =======================================================
; Hintergrund Card & Header
; =======================================================
[CardBG]
Meter=Shape
Shape=Rectangle 0,0,#CardW#,#CardH#,10 | Fill Color #CardBg# | StrokeWidth #CardBorderW# | Stroke Color #CardBorder#
DynamicVariables=1

[HeaderLeagueBtn]
Meter=String
MeterStyle=StyleTitle
X=#PadX#
Y=14
W=(#CardW# - #PadX# - 110)
ClipString=1
FontColor=#FG#
Text=#LeagueName#  v
ToolTipText=Klick: Liga wechseln (Dropdown)
LeftMouseUpAction=[!ToggleMeterGroup LeagueDropdown][!Redraw]
DynamicVariables=1

[BtnRefreshTable]
Meter=String
MeterStyle=StyleDim
X=(#CardW# - #PadX# - 58)
Y=16
StringAlign=Right
FontSize=9
FontColor=#Muted#
Text=Reload
ToolTipText=Tabelle aktualisieren
LeftMouseUpAction=[!CommandMeasure mJSON "Update"]
DynamicVariables=1

[BtnSettings]
Meter=String
MeterStyle=StyleDim
X=(#CardW# - #PadX#)
Y=16
StringAlign=Right
FontSize=9
FontColor=#Muted#
Text=Optionen
ToolTipText=Einstellungen oeffnen
LeftMouseUpAction=[!ActivateConfig "FootballSuite\Settings" "Settings.ini"][!Refresh "FootballSuite\Settings"]
DynamicVariables=1

[HeaderDivider]
Meter=Shape
Shape=Line #PadX#,42,(#CardW# - #PadX#),42 | Stroke Color #CardBorder# | StrokeWidth #CardBorderW#
DynamicVariables=1

; Spalten-Header
[ColHPos]
Meter=String
MeterStyle=StyleHeader
X=#PadX#
Y=48
FontColor=#Muted#
Text="#"
DynamicVariables=1

[ColHTeam]
